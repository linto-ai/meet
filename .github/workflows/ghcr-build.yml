name: Build and push images to GHCR

# Images are built and published ONLY when a version tag (vX.Y) is pushed.
# The image tag mirrors the git tag, so releases are easy to follow. Pushing a
# commit to a branch no longer triggers a build. See docs/releasing.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the images (e.g. v1.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: linto-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: meet-backend
            context: .
            dockerfile: Dockerfile
            target: backend-production
          - image: meet-frontend
            context: .
            dockerfile: src/frontend/Dockerfile
            target: frontend-production
          - image: meet-frontend-dinum
            context: .
            dockerfile: docker/dinum-frontend/Dockerfile
            target: frontend-production
          - image: meet-summary
            context: ./src/summary
            dockerfile: src/summary/Dockerfile
            target: production
          - image: meet-agents
            context: ./src/agents
            dockerfile: src/agents/Dockerfile
            target: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building ${{ matrix.image }} tagged: $VERSION and latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:latest
