server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;
  
  # OIDC return page of the Twake Visio mobile app (native app, RFC 8252).
  # The app registers https://<this host>/auth/mobile-callback as its redirect
  # URI; this page hands the code and state over to the app's own scheme.
  # Chrome on Android does not dispatch a redirect to a custom scheme when it
  # answers the POST of the SSO login form, but does dispatch a navigation
  # started from a loaded HTTPS document. Must stay outside the SPA catch-all,
  # which would answer 200 with the web app instead.
  location ~ ^/auth/mobile-callback/?$ {
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      return 200 '<!doctype html><meta charset="utf-8"><title>Twake Visio</title><script>location.replace("twakevisio://callback" + location.search);</script><p>Ouverture de Twake Visio...</p><p><a href="twakevisio://callback">Ouvrir manuellement</a></p>';
  }

  location ^~ /assets/mediapipe/wasm/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files with caching
  location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files
  location / {
      try_files $uri $uri/ /index.html;
      # Add no-cache headers
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";  # HTTP 1.0 header for backward compatibility
      add_header Expires 0;
  }

  # Optionally, handle 404 errors by redirecting to index.html
  error_page 404 =200 /index.html;
}
